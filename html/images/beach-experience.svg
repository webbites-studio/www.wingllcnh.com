<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">The Beach Experience</title>
  <desc id="desc">Beach Experience invitation poster with sunset beach lounge and event details</desc>

  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ebe6df"/>
      <stop offset="35%" stop-color="#f1d6af"/>
      <stop offset="65%" stop-color="#e7b27d"/>
      <stop offset="100%" stop-color="#d3a56d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#c59152"/>
      <stop offset="50%" stop-color="#f2d7a0"/>
      <stop offset="100%" stop-color="#be7b36"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1">
      <stop offset="0%" stop-color="#563d31"/>
      <stop offset="50%" stop-color="#8f6857"/>
      <stop offset="100%" stop-color="#352a27"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d9b280"/>
      <stop offset="100%" stop-color="#7d5d4d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="700" cy="120" r="200" fill="#f9f0dd" opacity="0.30"/>
  <rect x="0" y="540" width="1200" height="260" fill="#efd7b1" opacity="0.82"/>

  <!-- Background shoreline -->
  <path d="M0 528 C220 500, 320 500, 520 540 S930 575, 1200 535 L1200 800 L0 800 Z" fill="url(#sea)" opacity="0.58"/>

  <!-- Wooden pergola -->
  <g>
    <path d="M620 96 L920 96 L1000 170 L540 170 Z" fill="#7b5847" opacity="0.9"/>
    <path d="M570 96 L620 96 L700 20 L630 20 Z" fill="#5c4338" opacity="0.85"/>
    <path d="M920 96 L970 96 L890 20 L820 20 Z" fill="#5c4338" opacity="0.85"/>
    <rect x="650" y="96" width="12" height="280" fill="#4b372e"/>
    <rect x="775" y="96" width="12" height="280" fill="#4b372e"/>
    <rect x="900" y="96" width="12" height="280" fill="#4b372e"/>
    <rect x="560" y="96" width="12" height="280" fill="#4b372e"/>
    <rect x="990" y="96" width="12" height="280" fill="#4b372e"/>
  </g>

  <!-- beach scene details / skyline -->
  <g opacity="0.7">
    <rect x="820" y="220" width="34" height="90" fill="#a17a5f"/>
    <rect x="860" y="200" width="28" height="110" fill="#aa7d5a"/>
    <rect x="900" y="214" width="40" height="96" fill="#a77c5b"/>
    <rect x="940" y="230" width="32" height="80" fill="#9b6d53"/>
    <rect x="980" y="206" width="44" height="104" fill="#9c7055"/>
    <rect x="1030" y="218" width="36" height="92" fill="#a7795c"/>
  </g>

  <!-- Right-side date circle -->
  <g filter="url(#shadow)">
    <circle cx="923" cy="220" r="150" fill="#f8f6f2" opacity="0.92"/>
    <circle cx="923" cy="220" r="128" fill="none" stroke="#d4b273" stroke-width="4"/>
    <text x="923" y="175" text-anchor="middle" fill="#191815" font-family="Georgia, serif" font-size="30" font-weight="700">Saturday</text>
    <text x="923" y="225" text-anchor="middle" fill="#191815" font-family="Georgia, serif" font-size="70" font-weight="700">SEPTEMBER</text>
    <text x="923" y="292" text-anchor="middle" fill="#191815" font-family="Georgia, serif" font-size="88" font-weight="700">12</text>
    <text x="923" y="318" text-anchor="middle" fill="#191815" font-family="Georgia, serif" font-size="28" font-weight="700">TH</text>
    <text x="923" y="364" text-anchor="middle" fill="#191815" font-family="Verdana, sans-serif" font-size="19" font-weight="700">2:00 PM — 6:00 PM</text>
  </g>

  <!-- Left top branding -->
  <g>
    <text x="123" y="92" fill="#171613" font-family="Georgia, serif" font-size="20" font-weight="700" letter-spacing="4">NETWORKING GROUP</text>
    <text x="90" y="164" fill="#171613" font-family="Georgia, serif" font-size="92" font-weight="700">WI</text>
    <text x="110" y="240" fill="#171613" font-family="Georgia, serif" font-size="200" font-weight="700" letter-spacing="-10">BEACH</text>
    <text x="126" y="348" fill="url(#gold)" font-family="'Segoe Script', 'Bradley Hand', 'Lucida Handwriting', cursive" font-size="118" font-style="italic">Experience</text>
    <path d="M118 366 C310 395, 520 396, 700 370" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

    <text x="120" y="438" fill="#161410" font-family="Verdana, sans-serif" font-size="30" font-weight="700" letter-spacing="4">MUSIC • DRINKS • CONNECTIONS</text>
    <text x="120" y="480" fill="#161410" font-family="Verdana, sans-serif" font-size="26" font-weight="700" letter-spacing="3">LIGHT SNACKS OR REFRESHMENTS</text>

    <line x1="120" y1="520" x2="470" y2="520" stroke="#d2a461" stroke-width="4"/>
    <line x1="610" y1="520" x2="1030" y2="520" stroke="#d2a461" stroke-width="4"/>
    <path d="M525 505 l18 16 l18 -22 l18 22 l18 -16" fill="none" stroke="#d2a461" stroke-width="3"/>
  </g>

  <!-- Feature panels -->
  <g>
    <rect x="120" y="560" width="170" height="180" fill="#f6f2ec" opacity="0.95"/>
    <rect x="300" y="560" width="170" height="180" fill="#f6f2ec" opacity="0.95"/>
    <rect x="480" y="560" width="170" height="180" fill="#f6f2ec" opacity="0.95"/>

    <text x="205" y="610" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="22" font-weight="700">GOOD MUSIC</text>
    <text x="205" y="660" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="18">Feel the vibe</text>

    <text x="385" y="610" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="22" font-weight="700">REFRESHING</text>
    <text x="385" y="645" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="22" font-weight="700">DRINKS</text>
    <text x="385" y="680" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="18">Sip, relax &amp; enjoy</text>

    <text x="565" y="610" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="20" font-weight="700">MEANINGFUL</text>
    <text x="565" y="646" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="20" font-weight="700">CONNECTIONS</text>
    <text x="565" y="682" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="17">Real conversations,</text>
    <text x="565" y="706" text-anchor="middle" fill="#181512" font-family="Verdana, sans-serif" font-size="17">lasting relationships</text>
  </g>

  <!-- Right food card -->
  <g filter="url(#shadow)">
    <rect x="710" y="420" width="430" height="280" rx="12" fill="#f6f0ea" opacity="0.9"/>
    <text x="760" y="468" fill="#c78d4f" font-family="Georgia, serif" font-size="30" font-style="italic">Light Food</text>
    <text x="760" y="505" fill="#181512" font-family="Verdana, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ENJOY A SELECTION OF</text>
    <text x="760" y="527" fill="#181512" font-family="Verdana, sans-serif" font-size="16" font-weight="700" letter-spacing="2">LIGHT BITES INCLUDING:</text>
    <text x="760" y="570" fill="#181512" font-family="Georgia, serif" font-size="16">• Fresh Fruit &amp; Berries</text>
    <text x="760" y="600" fill="#181512" font-family="Georgia, serif" font-size="16">• Cheese &amp; Crackers</text>
    <text x="760" y="630" fill="#181512" font-family="Georgia, serif" font-size="16">• Veggie Cups with Dip</text>
    <text x="760" y="660" fill="#181512" font-family="Georgia, serif" font-size="16">• Mini Wraps &amp; Sandwiches</text>
    <text x="760" y="690" fill="#181512" font-family="Georgia, serif" font-size="16">• Assorted Pastries</text>
  </g>

  <!-- Table and props -->
  <g>
    <rect x="620" y="545" width="560" height="200" fill="#d6b58a" opacity="0.25"/>
    <ellipse cx="910" cy="670" rx="205" ry="82" fill="#f1d9a7" opacity="0.55"/>
    <rect x="780" y="600" width="185" height="90" rx="18" fill="#d9c2a4" opacity="0.9"/>
    <circle cx="820" cy="612" r="58" fill="#f2c171"/>
    <circle cx="865" cy="622" r="52" fill="#f09a5c"/>
    <circle cx="910" cy="614" r="42" fill="#d7d1c5"/>
    <circle cx="945" cy="622" r="32" fill="#8dc77a"/>
    <circle cx="965" cy="610" r="28" fill="#d1884b"/>
    <circle cx="820" cy="678" r="16" fill="#df6d4d"/>
    <circle cx="852" cy="690" r="18" fill="#f2bf6d"/>
    <circle cx="898" cy="695" r="15" fill="#c87044"/>
  </g>

  <!-- Bottom date and tag line -->
  <g>
    <text x="110" y="716" fill="#181512" font-family="Verdana, sans-serif" font-size="18" font-weight="700">SATURDAY</text>
    <text x="110" y="758" fill="#181512" font-family="Georgia, serif" font-size="42" font-weight="700">SEPTEMBER 12</text>
    <text x="110" y="780" fill="#181512" font-family="Verdana, sans-serif" font-size="16" font-weight="600" letter-spacing="2">TH</text>

    <text x="668" y="768" fill="#181512" font-family="Verdana, sans-serif" font-size="22" font-weight="700" letter-spacing="2">COME FOR THE VIBES. STAY FOR THE CONNECTIONS.</text>
  </g>
</svg>
